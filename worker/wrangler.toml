# The Daf Yomi backup service. Deploy from this folder with `npm run deploy`
# (see README.md). The Cloudflare account is chosen at deploy time.
name = "daf-yomi-sync"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Websites allowed to use the service from a browser, comma-separated.
ALLOWED_ORIGINS = "https://mendelcyprys.github.io,http://localhost:8000"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncStore"]

# v2: accounts and per-daf backups replace the single-key backups of v1
# (which only ever held test data).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts", "UserStore"]
deleted_classes = ["SyncStore"]
